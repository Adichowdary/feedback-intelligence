services:
  - type: web
    name: vera-feedback-intelligence
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_HOST
        value: 0.0.0.0
      - key: DEBUG
        value: "false"
      - key: HINDSIGHT_EMBEDDED
        value: "false"
      - key: HINDSIGHT_BANK_ID
        value: feedback-intelligence
